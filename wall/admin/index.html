<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>最果ての壁｜管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <header>
    <strong>最果ての壁｜管理</strong>
    <a href="../gallery/">壁へ戻る</a>
  </header>
  <main>
    <section id="loginPanel" class="login-panel">
      <label>
        <span>管理パスワード</span>
        <input id="adminToken" type="password" autocomplete="current-password">
      </label>
      <button id="loginButton" type="button">管理画面を開く</button>
      <p id="loginStatus" aria-live="polite"></p>
    </section>
    <section id="adminPanel" hidden>
      <div class="admin-heading">
        <p>削除した投稿は元に戻せません。</p>
        <button id="logoutButton" type="button">閉じる</button>
      </div>
      <div id="postList" class="post-list"></div>
      <button id="loadMore" type="button" hidden>続きを読み込む</button>
    </section>
  </main>
  <script src="../config.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
