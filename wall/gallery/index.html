<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>最果ての壁</title>
  <meta name="description" content="布教ヘッダーが隙間なく積み上がる、最果ての壁。">
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./gallery.css">
</head>
<body>
  <header class="wall-nav">
    <a class="wall-name" href="./">最果ての壁</a>
    <nav aria-label="ページ内ナビ">
      <a href="../">布教ヘッダーを作る</a>
      <span aria-hidden="true">｜</span>
      <a href="./">最果ての壁を見る</a>
      <span aria-hidden="true">｜</span>
      <a href="../../">TOP</a>
    </nav>
  </header>

  <main id="wall" class="wall" aria-label="新しい順に積まれた布教ヘッダー">
    <div id="userPosts"></div>
    <p id="wallStatus" class="wall-status" aria-live="polite"></p>
    <div id="loadSentinel" aria-hidden="true"></div>
  </main>
  <aside id="manageBar" class="manage-bar" hidden>
    <p>この投稿の削除用ページです</p>
    <button id="copyDeleteUrl" type="button">削除用URLをコピー</button>
    <button id="deletePost" class="delete-button" type="button">この投稿を削除</button>
  </aside>
  <script src="../config.js"></script>
  <script src="./gallery.js"></script>
</body>
</html>
