<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>布教ヘッダーを作る｜最果ての壁</title>
  <meta name="description" content="カラタチの最果てのセンセイ！への愛を刻んだ、X用の布教ヘッダーを作れます。">
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=New+Tegomin&family=Noto+Sans+JP:wght@500;700;900&family=Reggae+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">布教ヘッダーを作る</a>
    <nav aria-label="ページ内ナビ">
      <a href="./gallery/">壁を見る</a>
      <a href="../">TOP</a>
    </nav>
  </header>

  <main class="builder">
    <section class="form-panel" aria-label="布教ヘッダーの入力項目">
      <label class="inline-field">
        <span>ユーザー名</span>
        <input id="userName" type="text" maxlength="10" value="" placeholder="〇〇" autocomplete="off">
        <small><b id="nameCount">0</b>/10</small>
      </label>

      <label class="inline-field">
        <span>メッセージ</span>
        <input id="message" type="text" maxlength="16" value="" placeholder="16文字以内" autocomplete="off">
        <small><b id="messageCount">0</b>/16</small>
      </label>

      <div class="stamp-grid" role="list" aria-label="人物画像">
        <button class="stamp-choice is-active" data-stamp="maeda-a" type="button">
          <img src="./assets/stamps/maeda-a.png" alt="">
          <span>前田壮太 A</span>
        </button>
        <button class="stamp-choice" data-stamp="maeda-b" type="button">
          <img src="./assets/stamps/maeda-b.png" alt="">
          <span>前田壮太 B</span>
        </button>
        <button class="stamp-choice" data-stamp="oyama-a" type="button">
          <img src="./assets/stamps/oyama-a.png" alt="">
          <span>大山和也 A</span>
        </button>
        <button class="stamp-choice" data-stamp="oyama-b" type="button">
          <img src="./assets/stamps/oyama-b.png" alt="">
          <span>大山和也 B</span>
        </button>
      </div>

      <div class="stamp-add-row">
        <span>選択中：<b id="stampChoiceName">前田壮太 A</b></span>
        <button id="addStamp" class="small-button accent" type="button">タップして追加</button>
      </div>
    </section>

    <section class="preview-panel" aria-labelledby="preview-title">
      <h2 id="preview-title">布教ヘッダーを作る</h2>
      <div class="canvas-shell">
        <canvas id="headerCanvas" width="1500" height="500" aria-label="作成中の布教ヘッダー"></canvas>
      </div>

      <div class="edit-tools">
        <label>
          <span>大きさ</span>
          <input id="stampScale" type="range" min="30" max="260" value="100">
        </label>
        <label>
          <span>回転</span>
          <input id="stampRotation" type="range" min="-180" max="180" value="0">
        </label>
      </div>
      <div class="stamp-actions">
        <span>画像をドラッグで移動できます</span>
        <button id="bringForward" class="text-button stamp-control" type="button">前へ</button>
        <button id="sendBackward" class="text-button stamp-control" type="button">後ろへ</button>
        <button id="selectStamp" class="text-button stamp-control" type="button">選択</button>
        <button id="resetStamp" class="text-button" type="button">位置を戻す</button>
        <button id="deleteStamp" class="text-button danger" type="button">削除</button>
      </div>

      <div class="finish-actions">
        <button id="saveImage" class="primary-button" type="button">画像を保存する</button>
        <button id="publishWall" class="secondary-button" type="button">最果ての壁に積む（任意）</button>
      </div>
      <p id="statusMessage" class="status-message" aria-live="polite"></p>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
